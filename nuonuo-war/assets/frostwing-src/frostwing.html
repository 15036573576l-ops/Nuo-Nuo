<title>极寒之翼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=ZCOOL+XiaoWei&display=swap">
<style>
/* layout: one full-bleed stage; the dragon is the page. Chrome stays at the edges, thin as hoarfrost. */
:root{
  color-scheme: dark;
  --abyss:#02050c;          /* storm-night ground */
  --ink:#e4efff;            /* rime white text */
  --frost:#a9c9ff;          /* pale ice */
  --cobalt:#2f74ff;         /* the blood-light */
  --rime:rgba(170,205,255,.26);
  --glass:rgba(6,14,34,.46);
  --violet:#9a86ff;
  --display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --latin:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;min-height:320px;overflow:hidden;background:var(--abyss)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}

.mast{position:absolute;left:0;top:0;padding:clamp(16px,3vw,34px);pointer-events:none;display:flex;flex-direction:column;gap:6px;
  text-shadow:0 0 22px rgba(4,12,34,.9),0 1px 2px rgba(0,0,0,.6)}
.mast .eyebrow{font-family:var(--latin);font-style:italic;font-size:clamp(13px,1.5vw,17px);letter-spacing:.34em;color:var(--frost);opacity:.85;text-transform:uppercase}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6.2vw,76px);line-height:1;letter-spacing:.16em;color:var(--ink);text-wrap:balance}
.mast .sub{font-size:clamp(11px,1.15vw,13px);letter-spacing:.42em;color:var(--frost);opacity:.72;display:flex;align-items:center;gap:12px}
.mast .sub::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--frost),transparent)}

#hud{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,3vw,30px);
  display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity 1.2s .5s,transform 1.2s .5s}
#hud.on{opacity:1;transform:none}
#hud > *{pointer-events:auto;min-width:0}
.views,.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--rime);background:var(--glass);color:var(--ink);font:inherit;font-size:13px;letter-spacing:.22em;
  padding:9px 12px 9px 16px;cursor:pointer;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  transition:background .25s,color .25s,border-color .25s}
.btn:hover{background:rgba(40,100,255,.22);border-color:rgba(190,220,255,.6)}
.btn[aria-pressed="true"]{background:rgba(52,118,255,.34);border-color:rgba(200,225,255,.75);color:#fff}
.btn:focus-visible,.storm input:focus-visible{outline:2px solid var(--frost);outline-offset:3px}
.btn.cast{font-family:var(--display);font-size:17px;letter-spacing:.3em;padding:9px 14px 9px 20px;border-color:rgba(150,190,255,.55);
  background:linear-gradient(180deg,rgba(60,120,255,.30),rgba(10,26,70,.5))}
.btn.cast:hover{background:linear-gradient(180deg,rgba(90,150,255,.5),rgba(16,40,110,.6))}
.storm{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.3em;color:var(--frost);padding:0 4px}
.storm input{-webkit-appearance:none;appearance:none;width:clamp(90px,14vw,150px);height:18px;background:transparent;cursor:pointer;margin:0}
.storm input::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,var(--rime),var(--frost))}
.storm input::-moz-range-track{height:1px;background:linear-gradient(90deg,var(--rime),var(--frost))}
.storm input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;background:var(--ink);transform:rotate(45deg);border:0;box-shadow:0 0 10px var(--cobalt)}
.storm input::-moz-range-thumb{width:11px;height:11px;background:var(--ink);transform:rotate(45deg);border:0;border-radius:0;box-shadow:0 0 10px var(--cobalt)}
.hint{position:absolute;right:0;top:0;padding:clamp(16px,3vw,34px);font-size:11px;letter-spacing:.3em;color:var(--frost);opacity:.55;pointer-events:none;text-align:right;
  text-shadow:0 0 12px rgba(4,12,34,.9);transition:opacity 1.5s}
.hint.seen{opacity:0}

#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center;
  background:radial-gradient(ellipse at 50% 42%,#0b1c44 0%,#040a1a 55%,var(--abyss) 100%);transition:opacity 1.3s ease;z-index:5}
#loader.gone{opacity:0;pointer-events:none}
#loader .lt{font-family:var(--display);font-size:clamp(30px,6vw,56px);letter-spacing:.3em;margin-right:-.3em;color:var(--ink)}
#loader .bar{width:min(240px,60vw);height:1px;background:var(--rime);overflow:hidden}
#loader .bar i{display:block;height:100%;background:var(--ink);box-shadow:0 0 12px var(--cobalt);transform-origin:left;transform:scaleX(0);transition:transform .35s ease}
#loader .msg{font-size:12px;letter-spacing:.4em;margin-right:-.4em;color:var(--frost);min-height:1.4em;max-width:34em;line-height:1.8}

@media (max-width:640px){
  #hud{justify-content:flex-start;gap:10px}
  .btn{font-size:12px;padding:8px 10px 8px 13px;letter-spacing:.16em}
  .btn.cast{font-size:15px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){#hud,#loader,.btn{transition:none}}
</style>

<div id="stage">
  <canvas id="gl" tabindex="0" role="img" aria-label="一头矗立于暴风雪中心的寒冰巨龙，双翼展开，可拖动环视"></canvas>
  <header class="mast">
    <span class="eyebrow">Frostwing</span>
    <h1>极寒之翼</h1>
    <span class="sub">暴风雪之眼 · 寒冰巨龙</span>
  </header>
  <div class="hint" id="hint">拖动环视 · 滚轮或双指缩放</div>
  <div id="hud">
    <div class="views" role="group" aria-label="镜头">
      <button class="btn" id="v-all" data-view="all" aria-pressed="true">全景</button>
      <button class="btn" id="v-head" data-view="head" aria-pressed="false">龙首</button>
      <button class="btn" id="v-wing" data-view="wing" aria-pressed="false">冰翼</button>
      <button class="btn" id="v-claw" data-view="claw" aria-pressed="false">利爪</button>
      <button class="btn" id="v-tail" data-view="tail" aria-pressed="false">龙尾</button>
    </div>
    <div class="acts">
      <label class="storm" for="storm">风雪<input id="storm" type="range" min="0" max="100" value="60" aria-label="风雪强度"></label>
      <button class="btn" id="orbit" aria-pressed="true">环绕</button>
      <button class="btn cast" id="flap">振翼</button>
      <button class="btn cast" id="roar">咆哮</button>
    </div>
  </div>
  <div id="loader" role="status" aria-live="polite">
    <div class="lt">极寒之翼</div>
    <div class="bar"><i id="loadbar"></i></div>
    <div class="msg" id="loadtext">凝冰</div>
  </div>
</div>

attribute vec4 aSeed;
uniform float uTime; uniform float uStorm; uniform float uDensity; uniform vec2 uRes;
varying vec2 vQ; varying float vA;
vec3 flake(float t, vec4 s){
  float r = mix(2.5, 62., sqrt(s.x));
  float w = (0.35+0.9*uStorm)*(11./(r+7.))*(0.7+0.6*s.w);
  float th = s.y*6.2831 + t*w;
  float H = 34.;
  float fall = (1.3 + 3.0*s.w)*(0.6+0.5*uStorm);
  float y = mod(s.z*H - t*fall, H) - 1.;
  r += sin(t*0.6 + s.w*40.)*1.6 + sin(t*1.7+s.y*50.)*0.5;
  y += sin(t*1.1 + s.x*60.)*0.5;
  return vec3(cos(th)*r, y, sin(th)*r);
}
void main(){
  vQ = position.xy;
  float keep = step(fract(aSeed.w*7.31+aSeed.x*3.7), uDensity);
  vec3 p1 = flake(uTime, aSeed), p0 = flake(uTime-0.035, aSeed);
  vec4 v1 = viewMatrix*vec4(p1,1.), v0 = viewMatrix*vec4(p0,1.);

  float sz = max(size, px*0.75);
  vec2 dir = v1.xy - v0.xy; float dl = length(dir);
  dir = dl > 1e-5 ? dir/dl : vec2(0.,1.);
  vec2 nrm = vec2(-dir.y, dir.x);
  vec3 vp = mix(v0.xyz, v1.xyz, position.x*0.5+0.5);
  vp.xy += dir*position.x*sz + nrm*position.y*sz;
