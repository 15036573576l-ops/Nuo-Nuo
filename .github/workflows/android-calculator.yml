name: Build Android Calculator

on:
  push:
    paths:
      - 'calculator-android/**'
      - '.github/workflows/android-calculator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NuoCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NuoCalculator-apk
          path: calculator-android/NuoCalculator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calculator-v${{ github.run_number }}
          name: 糯糯计算器 v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: 安卓手机直接下载下面的 NuoCalculator.apk 安装即可（需允许“安装未知来源应用”）。
          files: calculator-android/NuoCalculator.apk
